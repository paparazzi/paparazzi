# Tests of the installer (./install.sh, sw/tools/install).
#  - dry-run, when the installer changes: the commands of every component for each Ubuntu version (--os), and the
#    documentation pages
#  - install, every week (new Ubuntu packages) or by hand (Actions > Installer > Run workflow): a real installation in
#    the bare Ubuntu Docker images (python3 installed first, like docker/*), then the Python modules are imported
name: Installer

on:
  push:
    paths: ['install.sh', 'requirements.txt', 'sw/tools/install/**', '.github/workflows/installer.yml']
  pull_request:
    paths: ['install.sh', 'requirements.txt', 'sw/tools/install/**', '.github/workflows/installer.yml']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: commands of every component per Ubuntu version
        run: |
          for os in 20.04 22.04 24.04 26.04; do
            for python in system venv; do
              ./install.sh --os=$os --dry-run --yes --python=$python available
            done
          done
      - name: documentation
        run: |
          ./install.sh --doc > /dev/null
          ./install.sh --wiki > /dev/null
          ./install.sh --doxygen=/tmp/dox
          ./install.sh --requirements

  install:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ubuntu: '22.04', python: system}
          - {ubuntu: '24.04', python: system}
          - {ubuntu: '24.04', python: venv}
          - {ubuntu: '26.04', python: venv}
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      # git first, so that the checkout is a git clone and the installer can get the submodules (pprzlink);
      # the container runs as root in a folder of another user
      - name: git
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: ./install.sh core python arm jsbsim
        run: ./install.sh --yes --python=${{ matrix.python }} core python arm jsbsim
      - name: everything installed
        run: |
          ./install.sh --list --python=${{ matrix.python }}
          test -z "$(./install.sh --list --python=${{ matrix.python }} | awk '$1 ~ /^(core|python|arm|jsbsim)$/ && $2 != "installed"')"
      - name: Python modules
        run: |
          PY=/usr/bin/python3; [ -x pprzEnv/bin/python3 ] && PY=pprzEnv/bin/python3
          $PY -c 'import lxml, numpy, scipy, ivy, serial, PyQt5, pyqtgraph, matplotlib, em, future; print("imports OK")'
